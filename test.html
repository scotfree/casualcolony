  body { background: #12161c; color: #c7d3de; font: 13px/1.6 ui-monospace, Menlo, monospace; padding: 20px; }

  .pass::before { content: "PASS  "; color: #5eead4; }
  .fail::before { content: "FAIL  "; color: #f87171; }
  .fail { color: #f87171; }

<body>
<h1>Casual Colony — tests</h1>
<div id="results"></div>
<div id="summary"></div>

<script type="module">
import { parseLevel, createRun, loadLevelSet, serializeLevel } from "./level.js";
import { solvePower, components } from "./power.js";
import { resolveColony, hasColony, poolIncome, starvationCost } from "./colony.js";
import {
  resolveTap, applyTurn, tap, settle, poweredFraction, revealedFraction,
} from "./rules.js";
import { describeTurn } from "./log.js";
import { describeBudget } from "./budget.js";
import { visibleCells } from "./visibility.js";
import { cellAt } from "./grid.js";
import { buildingFor, BUILDINGS } from "./buildings.js";
import { loadSavedLevels, saveLevel } from "./storage.js";
import { exportLevelsText, exportIconsText, parseImport } from "./exchange.js";
import { SHIPPED_ICONS } from "./icons-data.js";
import { ICON_GRID_SIZE } from "./icons.js";

const results = document.getElementById("results");
let passed = 0;
let failed = 0;

function test(name, fn) {
  try {
    fn();
    passed++;
    add("pass", name);
  } catch (error) {
    failed++;
    add("fail", name);
    add("detail", error.message);
  }
}

function add(className, text) {
  const div = document.createElement("div");
  div.className = className;
  div.textContent = text;
  results.appendChild(div);
}

function assert(condition, message) {
  if (!condition) throw new Error(message);
}

function assertEqual(actual, expected, message) {
  const a = JSON.stringify(actual);
  const e = JSON.stringify(expected);
  if (a !== e) throw new Error(`${message}\n  expected ${e}\n  actual   ${a}`);
}

function assertThrows(fn, fragment) {
  let threw = null;
  try { fn(); } catch (error) { threw = error; }
  assert(threw !== null, `expected a throw mentioning "${fragment}", got none`);
  assert(
    threw.message.includes(fragment),
    `expected error mentioning "${fragment}", got "${threw.message}"`
  );
}

// Parse a level definition from row strings, using the same parser the game
// uses. Energy and goal are irrelevant to cascade/parsing tests, so give them
// permissive defaults; tests that care override via extra.
function buildLevel(rows, extra = {}) {
  return parseLevel({
    name: "test",
    size: { width: rows[0].length, height: rows.length },
    legend: {
      ".": "desert", "C": "crystal", "R": "redCrystal", "G": "greenCrystal", "D": "drain",
      "P": "powerPlant", "H": "residential", "F": "farm", "M": "mine",
    },
    grid: rows,
    energyBudget: 99,
    completionGoal: 1,
    ...extra,
  });
}

// A fresh *run* of that level — what gameplay tests actually work against.
function build(rows, extra = {}) {
  return createRun(buildLevel(rows, extra));
}

// How many cells the grid is currently carrying.
function litCount(world) {
  return world.cells.filter((cell) => cell.powered).length;
}

function poweredSet(world) {
  return new Set(world.cells.filter((cell) => cell.powered));
}

// --- Power (power.js) --------------------------------------------------------
//
// The core of the model: energy flows outward from generators, spending each
// unit once, and a tile lights only if the wave reaching it can pay for it.

// Letting time pass, with the board left alone. A click is the only clock, and
// every click the input layer can produce is also a move — so to watch a grid
// simply *run* we hand applyTurn a tap that switches an already-off tile off.
// It's a full turn through the real machinery; it just has nothing to change.
function passTurns(world, count, x = world.level.width - 1, y = 0) {
  const cell = cellAt(world, x, y);
  // applyTurn enables whatever cell it's handed, so this only passes time if
  // the target is inert. Aim it at a conducting tile and you quietly feed that
  // tile instead, which looks like the rules leaking energy.
  if (buildingFor(cell).conducts && !cell.enabled) {
    throw new Error(`passTurns target (${x},${y}) is a live tile — feeding it, not passing time`);
  }
  for (let i = 0; i < count; i++) {
    applyTurn(world, { kind: "disable", ok: true, cell });
  }
}

test("the reserve carries a load you feed, turn after turn", () => {
  // A crystal makes nothing, so it can never bank anything, so the reserve is
  // on the hook for it every turn it stays fed.
  const world = build(["C........."], { energyBudget: 5 });
  tap(world, cellAt(world, 0, 0));
  assertEqual(litCount(world), 1, "fed");
  assertEqual(world.energy, 4, "its cost of 1 came out of the reserve");
  passTurns(world, 3);
  assertEqual(world.energy, 1, "and comes out again every turn — upkeep, not a purchase");
  assertEqual(litCount(world), 1, "still lit, because the reserve can still carry it");
});

test("a generator you feed becomes free once it has banked its own cost", () => {
  // The jump-start is the whole bill. From the next turn the plant spends its
  // own storage, so upkeep drops to nothing and the reserve stops moving.
  const world = build(["P........."], { energyBudget: 5 });
  tap(world, cellAt(world, 0, 0));
  assertEqual(world.energy, 4, "turn one is a jump-start you pay for");
  assertEqual(cellAt(world, 0, 0).stored, 1, "and it banked its own cost out of its output");
  passTurns(world, 3);
  assertEqual(world.energy, 4, "it pays its own way from then on");
  assertEqual(litCount(world), 1, "and stays lit on its own storage");
});

test("storage banked this turn can't be spent this turn", () => {
  // Which is what makes the first click a jump-start rather than free: the
  // plant produces on turn one, but that output only reaches storage in time
  // for turn two.
  const world = build(["P."], { energyBudget: 0 });
  tap(world, cellAt(world, 0, 0));
  assertEqual(litCount(world), 0, "nothing banked yet and no reserve to carry it");
  assertEqual(cellAt(world, 0, 0).stored, 0, "and it never ran, so it banked nothing");
});

test("a generator with no storage never becomes free", () => {
  // storage 0 doesn't mean a one-shot — `enabled` persists, so the reserve
  // keeps paying and it keeps firing. It just never pays its own way.
  const world = build(["P........."], { energyBudget: 5 });
  const saved = BUILDINGS.powerPlant.storage;
  try {
    BUILDINGS.powerPlant.storage = 0;
    tap(world, cellAt(world, 0, 0));
    assertEqual(world.energy, 4, "carried by the reserve");
    assertEqual(cellAt(world, 0, 0).stored, 0, "with nowhere to bank its output");
    passTurns(world, 2);
    assertEqual(world.energy, 2, "so the reserve keeps paying, every turn");
    assertEqual(litCount(world), 1, "and it keeps running while it can be paid for");
  } finally {
    BUILDINGS.powerPlant.storage = saved;
  }
});

test("a generator refills itself before the cascade sees any of it", () => {
  // Refill-first is what guarantees an engine buys its own next turn. The grid
  // gets the remainder, so the cascade is one crystal shorter than the raw 5.
  const world = build(["PCCCCC"], { energyBudget: 9 });
  tap(world, cellAt(world, 0, 0));
  assertEqual(cellAt(world, 0, 0).stored, 1, "its own next turn, bought first");
  assertEqual(litCount(world), 5, "and 4 left over, so four crystals");
});

test("storage never pays for a neighbour, only for its own tile", () => {
  // The Milestone 19 disaster was a wave spending a stock as though it were an
  // income. Storage is a stock, so it has to stay bounded to its own tile: a
  // charged plant must not push the cascade one tile further than its
  // post-refill output pays for.
  const world = build(["PCCCCC."], { energyBudget: 9 });
  tap(world, cellAt(world, 0, 0));
  const reach = litCount(world);
  passTurns(world, 5); // plenty of turns for a leak to accumulate
  assertEqual(litCount(world), reach, "a charged plant reaches no further than turn one");
  assertEqual(cellAt(world, 0, 0).stored, 1, "and storage stays capped, never banking a hoard");
});

test("a generator the cascade reaches charges, then stops billing its grid", () => {
  // Second plant is lit by the first, so its cost comes out of grid surplus on
  // turn one. Once charged it pays for itself and hands that surplus back.
  const world = build(["PP"], { energyBudget: 9 });
  tap(world, cellAt(world, 0, 0));
  const second = cellAt(world, 1, 0);
  assert(second.powered, "reached by the first plant's cascade");
  assertEqual(second.stored, 1, "and it banked its own cost while it was up");

  const solved = solvePower(world, world.energy);
  assert(solved.selfPowered.has(second), "so next turn it runs itself");
  assertEqual(solved.perGrid[0].draw, 0, "and the grid stops paying for it");
});

test("a tile on its own storage survives a reserve that can't pay", () => {
  // Upkeep is all-or-none, but storage isn't part of that bargain — an engine
  // you got going keeps going even on the turn your loads all drop.
  const world = build(["P.C"], { energyBudget: 2 });
  tap(world, cellAt(world, 0, 0));  // jump-start: reserve 2 -> 1
  tap(world, cellAt(world, 2, 0));  // an unreachable crystal: reserve 1 -> 0
  passTurns(world, 1);              // now the reserve can't carry the crystal

  assert(cellAt(world, 0, 0).powered, "the plant is on its own storage");
  assert(!cellAt(world, 2, 0).powered, "the crystal had nothing to fall back on");
});

test("generation is conserved: a plant carries a fixed total load, not a radius", () => {
  // One click. The plant spends 1 of its 5 refilling its own storage and hands
  // the grid 4, which is exactly four crystals' worth.
  const world = build(["PCCCCCC..."], { energyBudget: 9 });
  tap(world, cellAt(world, 0, 0));
  assertEqual(litCount(world), 5, "plant plus four crystals, from a single tap");
  assert(!cellAt(world, 5, 0).powered, "the fifth is past the end of the energy");
});

test("within a cost class it's all or none, so the game never picks between equals", () => {
  // Three crystals equidistant from one plant. Ties are the common case, not a
  // corner, so any "top-left wins" fallback would be the rule quietly deciding
  // most boards.
  const easy = build([".C.", "CPC"], { energyBudget: 9 });
  tap(easy, cellAt(easy, 1, 1));
  assertEqual(litCount(easy), 4, "generation 5 covers all three");

  const tight = build([".C.", "CPC"], { energyBudget: 9 });
  const saved = BUILDINGS.powerPlant.generation;
  try {
    BUILDINGS.powerPlant.generation = 2; // enough for two of the three
    tap(tight, cellAt(tight, 1, 1));
    assertEqual(litCount(tight), 1, "and none of them light rather than an arbitrary two");
  } finally {
    BUILDINGS.powerPlant.generation = saved;
  }
});

test("the dearest tiles reached get first refusal, and can starve what's past them", () => {
  // Both hang off the same plant's 5. The drain costs 4 and is served first;
  // the residential needs 2 and only 1 is left.
  const world = build([".D..", ".PH."], { energyBudget: 9 });
  tap(world, cellAt(world, 1, 1));
  const powered = [...poweredSet(world)].map((c) => c.type).sort();
  assertEqual(powered, ["drain", "powerPlant"], "the drain takes the energy first");
});

test("the reserve ticks down toward your upkeep, then everything you fed drops", () => {
  // The rise-and-fall: upkeep is flat, so the pool draining is a countdown you
  // can read several turns ahead. When it can't cover the bill, it's all or
  // nothing rather than the rule choosing which of your tiles to keep.
  // Crystals, not plants: a load never banks anything, so it stays on the
  // reserve's bill and the countdown is real.
  const world = build(["C...C....."], { energyBudget: 5 });
  tap(world, cellAt(world, 0, 0));
  tap(world, cellAt(world, 4, 0));
  assertEqual(litCount(world), 2, "two fed crystals, upkeep 2");
  assertEqual(world.energy, 2, "5 less 1 for the first turn, less 2 for the second");
  passTurns(world, 1);
  assertEqual(world.energy, 0, "one more turn of upkeep empties it");
  passTurns(world, 1);
  assertEqual(litCount(world), 0, "and now neither is carried, so neither runs");
});

test("generation stays inside its own grid", () => {
  // The plant has 4 spare and the crystals need 3, but nothing is wired
  // between them — so the surplus is stranded. This is the whole reason
  // topology is worth playing with.
  const world = build(["P.CCC"], { energyBudget: 9 });
  tap(world, cellAt(world, 0, 0));
  assertEqual(components(world).length, 2, "the desert splits them");
  assertEqual(litCount(world), 1, "spare energy can't jump the gap");
});

test("a reserve that can't cover every tile you fed carries none of them", () => {
  // Two fed crystals, upkeep 2. Anything less than the full bill and neither
  // runs — the rule never picks which of your tiles matters. (Plants would
  // sidestep this entirely: once charged they don't draw on the reserve.)
  const world = build(["C...C....."], { energyBudget: 9 });
  tap(world, cellAt(world, 0, 0));
  tap(world, cellAt(world, 4, 0));
  assertEqual(solvePower(world, 2).powered.size, 2, "exactly enough for both");
  assertEqual(solvePower(world, 2).fromPool, 2, "and it pays exactly the bill");
  assertEqual(solvePower(world, 1).powered.size, 0, "enough for one of them, so neither");
  assertEqual(solvePower(world, 1).fromPool, 0, "and nothing is spent");
});

test("adjacent red columns stay separate grids — packing without a gap", () => {
  const world = build(["RR", "RR"]);
  for (const c of [...world.cells]) tap(world, cellAt(world, c.x, c.y));
  assertEqual(components(world).map((g) => g.length).sort(), [2, 2], "two vertical runs, touching");

  const plain = build(["CC", "CC"]);
  for (const c of [...plain.cells]) tap(plain, cellAt(plain, c.x, c.y));
  assertEqual(components(plain).map((g) => g.length), [4], "plain crystal would merge them");
});

test("a crossing axis breaks a run rather than bridging it", () => {
  // Honest about the limit: one tile has one axis, so runs can't cross.
  const world = build([".R.", "GGG", ".R."]);
  for (const c of world.cells.filter((c) => c.type !== "desert")) tap(world, cellAt(world, c.x, c.y));
  assertEqual(components(world).map((g) => g.length).sort(), [1, 1, 3], "the green row cuts the red run");
});

test("feeding a tile the wave already reaches is not a move", () => {
  // The only move is putting your reserve behind a tile. A lit tile doesn't
  // need it, so the click does nothing and no turn passes.
  const world = build(["PCCCCCC..."], { energyBudget: 9 });
  tap(world, cellAt(world, 0, 0));
  assertEqual(litCount(world), 5, "the plant carries four crystals on its own");
  const again = resolveTap(world, cellAt(world, 2, 0));
  assertEqual(again.ok, false, "that crystal is already lit");
  assertEqual(again.reason, "noop", "and says why");
});

test("a jump-start is carried by the reserve, every turn", () => {
  // The crystal is across desert, so nothing can ever reach it and the reserve
  // is the only thing paying — which isolates the jump-start from the wave.
  const world = build(["P...C...."], { energyBudget: 9 });
  tap(world, cellAt(world, 0, 0));
  assertEqual(litCount(world), 1, "the plant's generation has nowhere to go");
  assertEqual(world.energy, 8, "upkeep 1 for the jump-start");

  tap(world, cellAt(world, 4, 0));
  assertEqual(litCount(world), 2, "fed directly, it lights on the reserve alone");
  // Only the crystal is still billed: the plant is on its own storage by now.
  assertEqual(world.energy, 7, "upkeep is 1 a turn — the crystal, not the plant");
  passTurns(world, 1);
  assertEqual(world.energy, 6, "and stays 1 a turn, for as long as it's fed");
});

// --- Colony (residential / farm / mine) --------------------------------------

test("population and food are counted from what's powered, not what's enabled", () => {
  const world = build(["PHF....."], { energyBudget: 9 });
  tap(world, cellAt(world, 0, 0));
  const colony = resolveColony(world, poweredSet(world));
  assertEqual(colony.population, 1, "one house");
  assertEqual(colony.foodCapacity, 1, "one farm");
  assertEqual(colony.fed, true, "1 <= 1");
});

test("an unfed colony bleeds energy per person over capacity", () => {
  const world = build(["PHH....."], { energyBudget: 20, starvationPenalty: 2 });
  tap(world, cellAt(world, 0, 0));
  const colony = resolveColony(world, poweredSet(world));
  assertEqual(colony.fed, false, "2 people, no food");
  assertEqual(starvationCost(world, colony), 4, "2 over x penalty 2");
});

test("a mine pays the pool only with somebody living there", () => {
  const noone = build(["PMF....."], { energyBudget: 20 });
  tap(noone, cellAt(noone, 0, 0));
  let colony = resolveColony(noone, poweredSet(noone));
  assertEqual(poolIncome(noone, poweredSet(noone), colony), 0, "a mine with nobody to work it earns nothing");

  // The mine is across desert on its own, fed straight from the reserve, so
  // the plant's 5 only has to carry the farm and the house.
  const staffed = build(["PHF.M..."], { energyBudget: 20 });
  tap(staffed, cellAt(staffed, 0, 0));
  tap(staffed, cellAt(staffed, 4, 0));
  colony = resolveColony(staffed, poweredSet(staffed));
  assertEqual(poolIncome(staffed, poweredSet(staffed), colony), 2, "one resident puts it to work");
});

test("a mine's output never counts toward its own grid's budget", () => {
  // Which is what keeps the solve non-circular — see colony.js. The mine's 2
  // goes to the pool, so the grid has to cover its cost of 3 out of the
  // plant's 5 alone.
  const world = build(["PM"], { energyBudget: 9 });
  tap(world, cellAt(world, 0, 0));
  assertEqual(litCount(world), 2, "the plant's 5 covers the mine's cost of 3");
  const pair = build(["PMM"], { energyBudget: 9 });
  tap(pair, cellAt(pair, 0, 0));
  assertEqual(litCount(pair), 2, "the first mine takes 3 of the 5, leaving 2");
  assert(
    !cellAt(pair, 2, 0).powered,
    "the second needs 3 — and what the pair would pay the pool never enters the grid's sums"
  );
});

// --- Budget view (budget.js) -------------------------------------------------

// The row for `type` in the first grid that has one.
function budgetRow(budget, type, payer = null) {
  for (const grid of budget.grids) {
    const row = grid.rows.find((r) => r.type === type && (payer === null || r.payer === payer));
    if (row) return row;
  }
  return null;
}

test("budget names all three payers: storage, you, and the grid", () => {
  // The plant has banked its own cost by now, so it pays for itself; the
  // crystal you fed is still on your reserve; the rest ride the cascade.
  const world = build(["PCCC.C"], { energyBudget: 9 });
  tap(world, cellAt(world, 0, 0));
  tap(world, cellAt(world, 5, 0));
  const budget = describeBudget(world);

  assertEqual(budgetRow(budget, "powerPlant").payer, "self", "it runs on its own storage");
  assertEqual(budgetRow(budget, "crystal", "grid").payer, "grid", "the cascade reached these");
  assertEqual(budgetRow(budget, "crystal", "you").payer, "you", "this one is on your reserve");
});

test("budget groups same-type tiles but never across payers", () => {
  // Feed one crystal directly; the plant's cascade reaches the other two.
  const world = build(["PCCC"], { energyBudget: 9 });
  tap(world, cellAt(world, 3, 0));
  tap(world, cellAt(world, 0, 0));
  const budget = describeBudget(world);
  const crystals = budget.grids[0].rows.filter((r) => r.type === "crystal");

  assertEqual(crystals.length, 2, "fed crystals and cascaded crystals stay separate rows");
  const grid = crystals.find((r) => r.payer === "grid");
  const you = crystals.find((r) => r.payer === "you");
  assertEqual(grid.count, 2, "the two the cascade reached fold into one row");
  assertEqual(you.count, 1, "the one you paid for stands alone");
  assertEqual(grid.cost, 2, "a group's cost is the whole group's");
});

test("a grid's generation is what's left after its generators refill themselves", () => {
  const world = build(["PCC"], { energyBudget: 9 });
  tap(world, cellAt(world, 0, 0));
  const budget = describeBudget(world);
  const grid = budget.grids[0];

  assertEqual(grid.generation, 4, "the plant keeps 1 of its 5 to buy its own next turn");
  assertEqual(grid.cascadeDraw, 2, "two crystals at 1 each, paid by the grid");
  assertEqual(grid.spare, 2, "what's left to reach further");

  // The rows have to add up to the header above them, or the table is telling
  // two different stories about the same grid.
  assertEqual(
    grid.rows.reduce((total, row) => total + (row.toPool ? 0 : row.generation), 0),
    grid.generation,
    "the plant's row reports what it handed over, not its nameplate 5"
  );
});

test("a mine's generation is tagged for the pool, not its grid", () => {
  const world = build(["PM"], { energyBudget: 9 });
  tap(world, cellAt(world, 0, 0));
  const budget = describeBudget(world);

  assertEqual(budget.grids[0].generation, 4, "only the plant feeds the grid, less its refill");
  assert(budgetRow(budget, "mine").toPool, "the mine's output is flagged as pool-bound");
});

test("a mine with nobody to work it reads as idle and pays nothing", () => {
  const world = build(["PM"], { energyBudget: 9 });
  tap(world, cellAt(world, 0, 0));
  const budget = describeBudget(world);

  assert(budgetRow(budget, "mine").idle, "powered, but no colony to staff it");
  assertEqual(budget.reserve.income, 0, "so it pays nothing into the pool");
});

test("reserve upkeep counts loads you fed, not generators paying their own way", () => {
  // The crystal across the desert can never be reached, so the reserve is the
  // only thing carrying it. The plant, by now, carries itself.
  const world = build(["PCC.C"], { energyBudget: 9 });
  tap(world, cellAt(world, 0, 0));
  tap(world, cellAt(world, 4, 0));
  const { reserve } = describeBudget(world);

  assertEqual(reserve.upkeep, 1, "the crystal only — the plant is on its own storage");
  assertEqual(reserve.net, -1, "no income yet, so the reserve just drains");
});

test("the reserve's totals say which tiles they're made of", () => {
  // The question the two-budget rule makes people ask: "−1 upkeep — from
  // what?" It's the one tile you fed, and the breakdown has to name it.
  const world = build(["PCC.C"], { energyBudget: 9 });
  tap(world, cellAt(world, 0, 0));
  tap(world, cellAt(world, 4, 0));
  const { reserve } = describeBudget(world);

  assertEqual(
    reserve.upkeepRows.map((r) => [r.name, r.count, r.amount]),
    [["Crystal", 1, 1]],
    "the crystal you fed, and nothing the cascade reached or storage covers"
  );
  assertEqual(
    reserve.upkeepRows.reduce((total, r) => total + r.amount, 0), reserve.upkeep,
    "and the breakdown adds up to the total it explains"
  );
  assertEqual(reserve.incomeRows, [], "nothing earning yet");
});

test("the income breakdown names the earners, and skips the idle ones", () => {
  const staffed = build(["PPHFM"], { energyBudget: 20, foodPerFarm: 1 });
  tap(staffed, cellAt(staffed, 0, 0));
  const earning = describeBudget(staffed).reserve;
  assertEqual(
    earning.incomeRows.map((r) => [r.name, r.count, r.amount]), [["Mine", 1, 2]],
    "one staffed mine, paying 2"
  );
  assertEqual(
    earning.incomeRows.reduce((total, r) => total + r.amount, 0), earning.income,
    "and it adds up to the total"
  );

  // Same mine, nobody living there: poolIncome skips it, so the breakdown must
  // too or the rows would contradict the number above them.
  const empty = build(["PPM"], { energyBudget: 20 });
  tap(empty, cellAt(empty, 0, 0));
  const idle = describeBudget(empty).reserve;
  assertEqual(idle.income, 0, "no colony, so no income");
  assertEqual(idle.incomeRows, [], "and nothing claiming to earn");
});

test("turnsLeft counts turns the reserve can still cover upkeep in full", () => {
  // An unreachable crystal: upkeep 1 a turn against a reserve of 4, so it pays
  // at 4, 3, 2 and 1, then can't.
  const world = build(["C"], { energyBudget: 5 });
  tap(world, cellAt(world, 0, 0));
  const { reserve } = describeBudget(world);

  assertEqual(reserve.energy, 4, "the feeding tap already took its 1");
  assertEqual(reserve.turnsLeft, 4, "four more turns before upkeep can't be met");
});

test("a self-sustaining board reports no deadline", () => {
  // One plant's 4 spare can't carry a whole colony (2 + 2 + 3), so the second
  // plant is reached by the cascade and adds its own. Both end up on their own
  // storage, so you pay nothing and a staffed mine pays in.
  const world = build(["PPHFM"], { energyBudget: 20, foodPerFarm: 1 });
  tap(world, cellAt(world, 0, 0));
  const { reserve } = describeBudget(world);

  assert(reserve.staffed, "somebody lives here and is fed");
  assertEqual(reserve.upkeep, 0, "both plants run on their own storage");
  assertEqual(reserve.income, 2, "the mine is staffed, so it pays");
  assertEqual(reserve.net, 2, "pure income");
  assertEqual(reserve.turnsLeft, null, "no deadline when nothing is draining");
});

test("over-committed upkeep reads as blocked, with the tiles struck out", () => {
  // Two fed crystals is 2 a turn against a reserve of 1 — all-or-none, so
  // neither runs, and the view has to say why rather than showing an empty
  // board. (Plants would survive this on storage; loads have nothing to fall
  // back on, which is what makes them the thing that can actually fail.)
  const world = build(["C.C"], { energyBudget: 2 });
  tap(world, cellAt(world, 0, 0));
  tap(world, cellAt(world, 2, 0));
  const budget = describeBudget(world);

  assert(budget.reserve.blocked, "upkeep can't be met");
  assertEqual(budget.reserve.turnsLeft, null, "no countdown once nothing runs");
  const dark = budget.grids.flatMap((g) => g.rows).filter((r) => r.dark);
  assert(dark.length > 0, "fed-but-dark tiles are still listed");
});

test("budget is empty and safe before the first tap", () => {
  const budget = describeBudget(build(["PCC"]));
  assert(budget.empty, "nothing running yet");
  assertEqual(budget.grids.length, 0, "no grids to show");
  assertEqual(budget.reserve.upkeep, 0, "nothing owed");
});

test("describeBudget changes nothing on the board", () => {
  const world = build(["PCC"], { energyBudget: 9 });
  tap(world, cellAt(world, 0, 0));
  const before = world.cells.map((c) => `${c.powered}${c.enabled}`).join();
  const energy = world.energy;
  describeBudget(world);
  assertEqual(world.cells.map((c) => `${c.powered}${c.enabled}`).join(), before, "board");
  assertEqual(world.energy, energy, "energy");
  assert(!("staffedNow" in world.cells[0]), "no scratch fields left behind");
});

// --- Rules (resolveTap / applyTurn) ------------------------------------------

test("a click only ever feeds a tile, and inert tiles aren't clickable", () => {
  const world = build(["C."]);
  assertEqual(resolveTap(world, cellAt(world, 0, 0)).kind, "enable", "dark -> fed");
  tap(world, cellAt(world, 0, 0));
  assertEqual(resolveTap(world, cellAt(world, 0, 0)).ok, false, "there is no switching off");
  assertEqual(resolveTap(world, cellAt(world, 1, 0)).ok, false, "desert does nothing");
  assertEqual(resolveTap(world, cellAt(world, 1, 0)).reason, "inert", "and says why");
});

test("the pulse ripples outward from the generator, not from your finger", () => {
  const world = build(["CCPCC"], { energyBudget: 9 });
  tap(world, cellAt(world, 2, 0), 1000); // one tap on the plant lights the row
  assertEqual(cellAt(world, 2, 0).litAt, 1000, "the plant lights first");
  assert(cellAt(world, 1, 0).litAt > 1000, "its neighbour a moment later");
  assert(cellAt(world, 0, 0).litAt > cellAt(world, 1, 0).litAt, "and the far end later still");
});

test("poweredFraction counts the whole board; revealedFraction is monotonic", () => {
  // A crystal, so there's nothing banked to keep it alive once the reserve
  // can't carry it. A plant would survive this on its own storage.
  const world = build(["C..."], { energyBudget: 4, fogDistance: 1, startsVisible: [[0, 0]] });
  tap(world, cellAt(world, 0, 0));
  assertEqual(poweredFraction(world), 0.25, "1 of 4 cells");
  const seenBefore = revealedFraction(world);
  world.energy = 0;
  applyTurn(world, { kind: "enable", ok: true, cell: cellAt(world, 0, 0) });
  assertEqual(poweredFraction(world), 0, "powered drops back");
  assertEqual(revealedFraction(world), seenBefore, "but revealed never does");
});

// --- The shipped level set ---------------------------------------------------
// Loaded over fetch, so these run asynchronously after the tests above.

const summary = document.getElementById("summary");

(async () => {
  try {
    const rawLevels = await loadLevelSet("./levels/levels.json");

        test("levels.json is a non-empty array of named levels", () => {
      assert(Array.isArray(rawLevels) && rawLevels.length > 0, "must be a non-empty array");
      for (const record of rawLevels) {
        assert(typeof record.name === "string" && record.name, "each level is named");
      }
    });

    // Plays a level through the *real* rules — the same resolveTap/applyTap
    // game.js's pointerdown calls, not a reimplementation of them. That's the
    // whole point of rules.js: a walkthrough asserted here can't quietly
    // disagree with what the game actually does.
    function play(record, taps) {
      const run = createRun(parseLevel(record));
      const blocked = [];
      for (const [x, y] of taps) {
        if (!tap(run, cellAt(run, x, y)).ok) blocked.push(`${x},${y}`);
      }
      return { run, blocked, fraction: activatedFraction(run) };
    }

    // Deliberately thin. Assertions about *mechanics* live on the synthetic
    // fixtures above; coupling them to a shipped level's exact layout is what
    // broke five tests the last time a level was edited, and it's the level
    // micro-tuning trap encoded in the suite. All that's checked here is that
    // every level actually loads and can be played.

    test("every shipped level parses and settles", () => {
      for (const record of rawLevels) {
        const run = createRun(parseLevel(record));
        settle(run);
        assert(run.cells.length > 0, `${record.name} has cells`);
        assert(run.level.goal.value > 0, `${record.name} asks for something`);
      }
    });

    test("every shipped level offers a legal opening move", () => {
      // A level you can't start is broken however good it looks — a fogged
      // board with no seed, or one where nothing is clickable.
      for (const record of rawLevels) {
        const run = createRun(parseLevel(record));
        settle(run);
        const playable = run.cells.some((cell) => resolveTap(run, cell).ok);
        assert(playable, `${record.name} has no legal first click`);
      }
    });

    test("every shipped level can be driven toward its goal", () => {
      // Constructive, not optimal: switch on whatever is legal and affordable,
      // greedily, and check the level responds — power actually rises. It
      // proves the level is alive, without pinning down one right answer.
      for (const record of rawLevels) {
        const run = createRun(parseLevel(record));
        settle(run);
        let best = 0;
        for (let move = 0; move < 40; move++) {
          const candidate = run.cells.find(
            (cell) => !cell.enabled && resolveTap(run, cell).ok
          );
          if (!candidate) break;
          tap(run, candidate);
          best = Math.max(best, poweredFraction(run));
        }
        assert(best > 0, `${record.name} never powered anything`);
      }
    });

  } catch (error) {
    failed++;
    add("fail", "shipped level set could not be loaded");
    add("detail", error.message);
  } finally {
    summary.textContent = `${passed} passed, ${failed} failed`;
    summary.style.color = failed > 0 ? "#f87171" : "#5eead4";
  }
})();
