<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casual Colony — tests</title>
<style>
  body { background: #12161c; color: #c7d3de; font: 13px/1.6 ui-monospace, Menlo, monospace; padding: 20px; }
  h1 { font-size: 15px; font-weight: normal; color: #8ea3b5; }
  .pass::before { content: "PASS  "; color: #5eead4; }
  .fail::before { content: "FAIL  "; color: #f87171; }
  .fail { color: #f87171; }
  .detail { color: #6b7f91; padding-left: 46px; }
  #summary { margin-top: 16px; padding-top: 12px; border-top: 1px solid #263341; }
</style>
</head>
<body>
<h1>Casual Colony — tests</h1>
<div id="results"></div>
<div id="summary"></div>

<script type="module">
import { parseLevel, createRun, loadLevelSet, serializeLevel } from "./level.js";
import { solvePower, components } from "./power.js";
import { resolveColony, hasColony, poolIncome, starvationCost } from "./colony.js";
import {
  resolveTap, applyTurn, tap, settle, poweredFraction, revealedFraction,
} from "./rules.js";
import { describeTurn } from "./log.js";
import { visibleCells } from "./visibility.js";
import { cellAt } from "./grid.js";
import { buildingFor, BUILDINGS } from "./buildings.js";
import { loadSavedLevels, saveLevel } from "./storage.js";
import { exportLevelsText, exportIconsText, parseImport } from "./exchange.js";
import { SHIPPED_ICONS } from "./icons-data.js";
import { ICON_GRID_SIZE } from "./icons.js";

const results = document.getElementById("results");
let passed = 0;
let failed = 0;

function test(name, fn) {
  try {
    fn();
    passed++;
    add("pass", name);
  } catch (error) {
    failed++;
    add("fail", name);
    add("detail", error.message);
  }
}

function add(className, text) {
  const div = document.createElement("div");
  div.className = className;
  div.textContent = text;
  results.appendChild(div);
}

function assert(condition, message) {
  if (!condition) throw new Error(message);
}

function assertEqual(actual, expected, message) {
  const a = JSON.stringify(actual);
  const e = JSON.stringify(expected);
  if (a !== e) throw new Error(`${message}\n  expected ${e}\n  actual   ${a}`);
}

function assertThrows(fn, fragment) {
  let threw = null;
  try { fn(); } catch (error) { threw = error; }
  assert(threw !== null, `expected a throw mentioning "${fragment}", got none`);
  assert(
    threw.message.includes(fragment),
    `expected error mentioning "${fragment}", got "${threw.message}"`
  );
}

// Parse a level definition from row strings, using the same parser the game
// uses. Energy and goal are irrelevant to cascade/parsing tests, so give them
// permissive defaults; tests that care override via extra.
function buildLevel(rows, extra = {}) {
  return parseLevel({
    name: "test",
    size: { width: rows[0].length, height: rows.length },
    legend: {
      ".": "desert", "C": "crystal", "R": "redCrystal", "G": "greenCrystal", "D": "drain",
      "P": "powerPlant", "H": "residential", "F": "farm", "M": "mine",
    },
    grid: rows,
    energyBudget: 99,
    completionGoal: 1,
    ...extra,
  });
}

// A fresh *run* of that level — what gameplay tests actually work against.
function build(rows, extra = {}) {
  return createRun(buildLevel(rows, extra));
}

// How many cells the grid is currently carrying.
function litCount(world) {
  return world.cells.filter((cell) => cell.powered).length;
}

function poweredSet(world) {
  return new Set(world.cells.filter((cell) => cell.powered));
}

// --- Power (power.js) --------------------------------------------------------
//
// The core of the model: energy flows outward from generators, spending each
// unit once, and a tile lights only if the wave reaching it can pay for it.

// Letting time pass, with the board left alone. A click is the only clock, and
// every click the input layer can produce is also a move — so to watch a grid
// simply *run* we hand applyTurn a tap that switches an already-off tile off.
// It's a full turn through the real machinery; it just has nothing to change.
function passTurns(world, count, x = world.level.width - 1, y = 0) {
  const cell = cellAt(world, x, y);
  for (let i = 0; i < count; i++) {
    applyTurn(world, { kind: "disable", ok: true, cell });
  }
}

test("a lone plant pays for itself and stays powered, turn after turn", () => {
  const world = build(["P........."], { energyBudget: 5 });
  tap(world, cellAt(world, 0, 0));
  assertEqual(litCount(world), 1, "switched on");
  assertEqual(world.energy, 5, "and cost the pool nothing — it generates more than it draws");
  passTurns(world, 5);
  assertEqual(litCount(world), 1, "still powered with no further input");
  assertEqual(world.energy, 5, "and still free");
});

test("a generator with no storage can't restart itself", () => {
  // storage >= cost is what makes something an engine rather than a one-shot.
  const world = build(["P."], { energyBudget: 0 });
  const saved = BUILDINGS.powerPlant.storage;
  try {
    BUILDINGS.powerPlant.storage = 0;
    tap(world, cellAt(world, 0, 0));
    assertEqual(litCount(world), 0, "nothing to bootstrap from, and no pool to carry it");
  } finally {
    BUILDINGS.powerPlant.storage = saved;
  }
});

test("generation is conserved: a plant carries a fixed total load, not a radius", () => {
  const world = build(["PCCCCCC..."], { energyBudget: 0 });
  tap(world, cellAt(world, 0, 0));
  for (let i = 1; i <= 4; i++) tap(world, cellAt(world, i, 0));
  assertEqual(litCount(world), 5, "plant (cost 1, makes 5) carries 4 crystals");
  tap(world, cellAt(world, 5, 0));
  assertEqual(litCount(world), 5, "one more and the wave simply stops short of it");
  assertEqual(
    world.cells.filter((c) => c.enabled && !c.powered).length, 1,
    "the tile past the end of the energy is the one that goes without"
  );
});

test("within a cost class it's all or none, so the game never picks between equals", () => {
  // Three crystals equidistant from one plant. Ties are the common case, not a
  // corner, so any "top-left wins" fallback would be the rule quietly deciding
  // most boards.
  const easy = build([".C.", "CPC"], { energyBudget: 0 });
  for (const cell of easy.cells.filter((c) => c.type !== "desert")) {
    tap(easy, cellAt(easy, cell.x, cell.y));
  }
  assertEqual(litCount(easy), 4, "surplus 4 covers all three");

  const tight = build([".C.", "CPC"], { energyBudget: 0 });
  const saved = BUILDINGS.powerPlant.generation;
  try {
    BUILDINGS.powerPlant.generation = 3; // surplus 2 — enough for two of the three
    for (const cell of tight.cells.filter((c) => c.type !== "desert")) {
      tap(tight, cellAt(tight, cell.x, cell.y));
    }
    assertEqual(litCount(tight), 1, "and none of them light rather than an arbitrary two");
  } finally {
    BUILDINGS.powerPlant.generation = saved;
  }
});

test("the dearest tiles reached get first refusal, and can starve what's past them", () => {
  // Both hang off the same plant's surplus of 4. The mine costs 3 and is served
  // first; the residential needs 2 and only 1 is left.
  const world = build([".M..", ".PH."], { energyBudget: 0 });
  for (const [x, y] of [[1, 0], [1, 1], [2, 1]]) tap(world, cellAt(world, x, y));
  const powered = [...poweredSet(world)].map((c) => c.type).sort();
  assertEqual(powered, ["mine", "powerPlant"], "the mine takes the energy first");
});

test("the reserve carries a deficit for a while, then the wave retreats", () => {
  // The rise-and-fall levels are built on: over-extend and you buy turns, not
  // an instant refusal.
  const world = build(["PCCCCCCC.."], { energyBudget: 9 });
  for (let x = 0; x <= 7; x++) tap(world, cellAt(world, x, 0));
  assertEqual(litCount(world), 8, "all eight running, on the reserve");
  assert(world.energy < 9, "which is already costing you");
  passTurns(world, 4);
  assertEqual(world.energy, 0, "the reserve empties");
  assertEqual(litCount(world), 5, "and the wave falls back to what the plant alone can carry");
});

test("generation stays inside its own grid", () => {
  // The plant has 4 spare and the crystals need 3, but nothing is wired
  // between them — so the surplus is stranded. This is the whole reason
  // topology is worth playing with.
  const world = build(["P.CCC"], { energyBudget: 0 });
  for (const x of [0, 2, 3, 4]) tap(world, cellAt(world, x, 0));
  assertEqual(components(world).length, 2, "the desert splits them");
  assertEqual(litCount(world), 1, "spare energy can't jump the gap");
});

test("when the reserve can't cover every grid asking, none of them draw on it", () => {
  // Two identical grids sitting exactly at break-even, each with one more
  // crystal enabled that only the reserve could pay for.
  const world = build(["PCCCCC.PCCCCC"], { energyBudget: 0 });
  for (const x of [0, 1, 2, 3, 4, 5, 7, 8, 9, 10, 11, 12]) tap(world, cellAt(world, x, 0));
  assertEqual(solvePower(world, 0).powered.size, 10, "nothing spare: both stop at break-even");
  assertEqual(solvePower(world, 1).powered.size, 10, "enough for one of them, so neither");
  const both = solvePower(world, 2);
  assertEqual(both.powered.size, 12, "enough for both, so both");
  assertEqual(both.fromPool, 2, "and the reserve pays exactly the two it owes");
});

test("adjacent red columns stay separate grids — packing without a gap", () => {
  const world = build(["RR", "RR"]);
  for (const c of [...world.cells]) tap(world, cellAt(world, c.x, c.y));
  assertEqual(components(world).map((g) => g.length).sort(), [2, 2], "two vertical runs, touching");

  const plain = build(["CC", "CC"]);
  for (const c of [...plain.cells]) tap(plain, cellAt(plain, c.x, c.y));
  assertEqual(components(plain).map((g) => g.length), [4], "plain crystal would merge them");
});

test("a crossing axis breaks a run rather than bridging it", () => {
  // Honest about the limit: one tile has one axis, so runs can't cross.
  const world = build([".R.", "GGG", ".R."]);
  for (const c of world.cells.filter((c) => c.type !== "desert")) tap(world, cellAt(world, c.x, c.y));
  assertEqual(components(world).map((g) => g.length).sort(), [1, 1, 3], "the green row cuts the red run");
});

test("switching a tile off is free, and stops the bleeding the same turn", () => {
  // Seven tiles on a plant that funds five: the reserve covers the other two,
  // and cutting them is the whole repair — no cost, no delay.
  const world = build(["PCCCCCC..."], { energyBudget: 6 });
  for (let i = 0; i <= 6; i++) tap(world, cellAt(world, i, 0));
  assertEqual(litCount(world), 7, "all seven, two of them on the reserve");
  assert(world.energy < 6, "which has been draining");

  tap(world, cellAt(world, 6, 0));
  tap(world, cellAt(world, 5, 0));
  assertEqual(litCount(world), 5, "back to what the plant funds by itself");
  const settled = world.energy;
  passTurns(world, 3);
  assertEqual(world.energy, settled, "and the drain stops dead — switching off costs nothing");
});

// --- Colony (residential / farm / mine) --------------------------------------

test("population and food are counted from what's powered, not what's enabled", () => {
  const world = build(["PHF....."], { energyBudget: 0 });
  for (const x of [0, 1, 2]) tap(world, cellAt(world, x, 0));
  const colony = resolveColony(world, poweredSet(world));
  assertEqual(colony.population, 1, "one house");
  assertEqual(colony.foodCapacity, 1, "one farm");
  assertEqual(colony.fed, true, "1 <= 1");
});

test("an unfed colony bleeds energy per person over capacity", () => {
  const world = build(["PHH....."], { energyBudget: 20, starvationPenalty: 2 });
  for (const x of [0, 1, 2]) tap(world, cellAt(world, x, 0));
  const colony = resolveColony(world, poweredSet(world));
  assertEqual(colony.fed, false, "2 people, no food");
  assertEqual(starvationCost(world, colony), 4, "2 over x penalty 2");
});

test("a mine pays the pool only with somebody living there", () => {
  const noone = build(["PMF....."], { energyBudget: 20 });
  for (const x of [0, 1, 2]) tap(noone, cellAt(noone, x, 0));
  let colony = resolveColony(noone, poweredSet(noone));
  assertEqual(poolIncome(noone, poweredSet(noone), colony), 0, "a mine with nobody to work it earns nothing");

  const staffed = build(["PMFH...."], { energyBudget: 20 });
  for (const x of [0, 1, 2, 3]) tap(staffed, cellAt(staffed, x, 0));
  colony = resolveColony(staffed, poweredSet(staffed));
  assertEqual(poolIncome(staffed, poweredSet(staffed), colony), 2, "one resident puts it to work");
});

test("a mine's output never counts toward its own grid's budget", () => {
  // Which is what keeps the solve non-circular — see colony.js. The mine's 2
  // goes to the pool, so the grid has to cover its cost of 3 out of the
  // plant's 5 alone.
  const world = build(["PM"], { energyBudget: 0 });
  tap(world, cellAt(world, 0, 0));
  tap(world, cellAt(world, 1, 0));
  assertEqual(litCount(world), 2, "plant makes 5, plant+mine cost 4 — just affordable");
  const pair = build(["PMM"], { energyBudget: 0 });
  for (const x of [0, 1, 2]) tap(pair, cellAt(pair, x, 0));
  assertEqual(litCount(pair), 2, "the second mine costs 3 against 1 left, so the wave stops");
  assert(
    !cellAt(pair, 2, 0).powered,
    "and what the pair would have paid into the pool never enters the grid's sums"
  );
});

// --- Rules (resolveTap / applyTurn) ------------------------------------------

test("a click toggles, and inert tiles aren't clickable", () => {
  const world = build(["C."]);
  assertEqual(resolveTap(world, cellAt(world, 0, 0)).kind, "enable", "off -> on");
  tap(world, cellAt(world, 0, 0));
  assertEqual(resolveTap(world, cellAt(world, 0, 0)).kind, "disable", "on -> off");
  assertEqual(resolveTap(world, cellAt(world, 1, 0)).ok, false, "desert does nothing");
  assertEqual(resolveTap(world, cellAt(world, 1, 0)).reason, "inert", "and says why");
});

test("the pulse ripples outward from the generator, not from your finger", () => {
  const world = build(["CCPCC"], { energyBudget: 0 });
  for (const x of [0, 1, 3, 4]) tap(world, cellAt(world, x, 0));
  tap(world, cellAt(world, 2, 0), 1000); // enable the plant last
  assertEqual(cellAt(world, 2, 0).litAt, 1000, "the plant lights first");
  assert(cellAt(world, 1, 0).litAt > 1000, "its neighbour a moment later");
  assert(cellAt(world, 0, 0).litAt > cellAt(world, 1, 0).litAt, "and the far end later still");
});

test("poweredFraction counts the whole board; revealedFraction is monotonic", () => {
  const world = build(["P..."], { energyBudget: 0, fogDistance: 1, startsVisible: [[0, 0]] });
  tap(world, cellAt(world, 0, 0));
  assertEqual(poweredFraction(world), 0.25, "1 of 4 cells");
  const seenBefore = revealedFraction(world);
  tap(world, cellAt(world, 0, 0)); // switch it off again
  assertEqual(poweredFraction(world), 0, "powered drops back");
  assertEqual(revealedFraction(world), seenBefore, "but revealed never does");
});

// --- Level parsing ----------------------------------------------------------

test("parses a valid level", () => {
  const world = build(["C.", ".C"]);
  assertEqual(world.level.width, 2, "width");
  assertEqual(world.level.height, 2, "height");
  assertEqual(world.cells.length, 4, "cell count");
  assertEqual(cellAt(world, 0, 0).type, "crystal", "top left");
  assertEqual(cellAt(world, 1, 0).type, "desert", "top right");
});

test("rejects a row of the wrong length", () => {
  assertThrows(() => parseLevel({
    size: { width: 3, height: 2 },
    legend: { ".": "desert" },
    grid: ["...", ".."],
  }), "row 1 has 2 characters");
});

test("rejects the wrong number of rows", () => {
  assertThrows(() => parseLevel({
    size: { width: 2, height: 3 },
    legend: { ".": "desert" },
    grid: ["..", ".."],
  }), "grid has 2 rows");
});

test("rejects an unknown grid character", () => {
  assertThrows(() => parseLevel({
    size: { width: 2, height: 1 },
    legend: { ".": "desert" },
    grid: [".X"],
  }), "Unknown character 'X'");
});

test("rejects a legend pointing at an unknown building", () => {
  assertThrows(() => parseLevel({
    size: { width: 1, height: 1 },
    legend: { "?": "sawmill" },
    grid: ["?"],
  }), "unknown building type 'sawmill'");
});

test("rejects a missing size", () => {
  assertThrows(() => parseLevel({ legend: {}, grid: [] }), "integer size.width");
});

test("rejects a missing energyBudget", () => {
  assertThrows(() => parseLevel({
    size: { width: 1, height: 1 },
    legend: { ".": "desert" },
    grid: ["."],
    completionGoal: 0.5,
  }), "non-negative integer energyBudget");
});

test("rejects a completionGoal of zero", () => {
  assertThrows(() => parseLevel({
    size: { width: 1, height: 1 },
    legend: { ".": "desert" },
    grid: ["."],
    energyBudget: 1,
    completionGoal: 0,
  }), "completionGoal must be between 0");
});

test("rejects a completionGoal above 1", () => {
  assertThrows(() => parseLevel({
    size: { width: 1, height: 1 },
    legend: { ".": "desert" },
    grid: ["."],
    energyBudget: 1,
    completionGoal: 1.5,
  }), "completionGoal must be between 0");
});

test("parses valid energyBudget and completionGoal", () => {
  const world = build(["C."], { energyBudget: 3, completionGoal: 0.5 });
  assertEqual(world.level.energyBudget, 3, "energyBudget");
  assertEqual(world.level.completionGoal, 0.5, "completionGoal");
  assertEqual(world.energy, 3, "energy starts at budget");
});

test("colony knobs default sensibly when omitted", () => {
  const world = build(["C."]);
  assertEqual(world.level.foodPerFarm, 1, "default foodPerFarm");
  assertEqual(world.level.starvationPenalty, 1, "default starvationPenalty");
});

test("rejects a negative foodPerFarm", () => {
  assertThrows(() => parseLevel({
    size: { width: 1, height: 1 },
    legend: { ".": "desert" },
    grid: ["."],
    energyBudget: 1,
    completionGoal: 0.5,
    foodPerFarm: -1,
  }), "foodPerFarm must be a non-negative number");
});

test("rejects a negative starvationPenalty", () => {
  assertThrows(() => parseLevel({
    size: { width: 1, height: 1 },
    legend: { ".": "desert" },
    grid: ["."],
    energyBudget: 1,
    completionGoal: 0.5,
    starvationPenalty: -1,
  }), "starvationPenalty must be a non-negative number");
});

test("parses custom colony knobs", () => {
  const world = build(["C."], { foodPerFarm: 4, starvationPenalty: 3 });
  assertEqual(world.level.foodPerFarm, 4, "custom foodPerFarm");
  assertEqual(world.level.starvationPenalty, 3, "custom starvationPenalty");
});

// --- Level serialization (the editor's save path) ----------------------------

test("serializeLevel round-trips an edited board", () => {
  const world = build(["C.", ".C"]);
  cellAt(world, 1, 0).type = "drain"; // simulate an edit made in the picker
  const record = serializeLevel(world, "edited");
  assertEqual(record.name, "edited", "name");
  assertEqual(record.grid, ["CD", ".C"], "the edit shows up in the grid");

  const reparsed = createRun(parseLevel(record));
  assertEqual(cellAt(reparsed, 1, 0).type, "drain", "re-parses back to the edited type");
});

test("serializeLevel carries level parameters through unchanged", () => {
  const world = build(["C."], {
    energyBudget: 7,
    foodPerFarm: 4,
    starvationPenalty: 3,
    fogDistance: 3,
    goal: { kind: "revealed", value: 0.4 },
  });
  const record = serializeLevel(world, "params");
  assertEqual(record.energyBudget, 7, "energyBudget");
  assertEqual(record.foodPerFarm, 4, "foodPerFarm");
  assertEqual(record.starvationPenalty, 3, "starvationPenalty");
  assertEqual(record.fogDistance, 3, "fogDistance");
  assertEqual(record.goal, { kind: "revealed", value: 0.4 }, "goal travels with it");
});

// --- Saved-level storage (localStorage, real in this browser) ---------------

test("saveLevel then loadSavedLevels round-trips", () => {
  const before = loadSavedLevels().length;
  saveLevel({
    name: "__test_level__",
    size: { width: 1, height: 1 },
    energyBudget: 1,
    completionGoal: 1,
    legend: { ".": "desert" },
    grid: ["."],
  });
  const after = loadSavedLevels();
  assertEqual(after.length, before + 1, "one more saved level");
  assert(after.some((r) => r.name === "__test_level__"), "the saved level is present");
});

test("saveLevel overwrites an existing entry with the same name", () => {
  saveLevel({
    name: "__test_level__",
    size: { width: 2, height: 1 },
    energyBudget: 2,
    completionGoal: 1,
    legend: { ".": "desert" },
    grid: [".."],
  });
  const matches = loadSavedLevels().filter((r) => r.name === "__test_level__");
  assertEqual(matches.length, 1, "still only one entry with this name");
  assertEqual(matches[0].size.width, 2, "overwritten, not duplicated");
});

// Clean up so re-running this page in a real browser doesn't leave test junk
// behind in localStorage. storage.js has no delete of its own (not needed by
// the game), so this pokes the same key directly.
{
  const all = JSON.parse(localStorage.getItem("casualcolony:levels") || "{}");
  delete all["__test_level__"];
  localStorage.setItem("casualcolony:levels", JSON.stringify(all));
}

// --- The shipped level set ---------------------------------------------------
// Loaded over fetch, so these run asynchronously after the tests above.

const summary = document.getElementById("summary");

(async () => {
  try {
    const rawLevels = await loadLevelSet("./levels/levels.json");

        test("levels.json is a non-empty array of named levels", () => {
      assert(Array.isArray(rawLevels) && rawLevels.length > 0, "must be a non-empty array");
      for (const record of rawLevels) {
        assert(typeof record.name === "string" && record.name, "each level is named");
      }
    });

    // Plays a level through the *real* rules — the same resolveTap/applyTap
    // game.js's pointerdown calls, not a reimplementation of them. That's the
    // whole point of rules.js: a walkthrough asserted here can't quietly
    // disagree with what the game actually does.
    function play(record, taps) {
      const run = createRun(parseLevel(record));
      const blocked = [];
      for (const [x, y] of taps) {
        if (!tap(run, cellAt(run, x, y)).ok) blocked.push(`${x},${y}`);
      }
      return { run, blocked, fraction: activatedFraction(run) };
    }

    // Deliberately thin. Assertions about *mechanics* live on the synthetic
    // fixtures above; coupling them to a shipped level's exact layout is what
    // broke five tests the last time a level was edited, and it's the level
    // micro-tuning trap encoded in the suite. All that's checked here is that
    // every level actually loads and can be played.

    test("every shipped level parses and settles", () => {
      for (const record of rawLevels) {
        const run = createRun(parseLevel(record));
        settle(run);
        assert(run.cells.length > 0, `${record.name} has cells`);
        assert(run.level.goal.value > 0, `${record.name} asks for something`);
      }
    });

    test("every shipped level offers a legal opening move", () => {
      // A level you can't start is broken however good it looks — a fogged
      // board with no seed, or one where nothing is clickable.
      for (const record of rawLevels) {
        const run = createRun(parseLevel(record));
        settle(run);
        const playable = run.cells.some((cell) => resolveTap(run, cell).ok);
        assert(playable, `${record.name} has no legal first click`);
      }
    });

    test("every shipped level can be driven toward its goal", () => {
      // Constructive, not optimal: switch on whatever is legal and affordable,
      // greedily, and check the level responds — power actually rises. It
      // proves the level is alive, without pinning down one right answer.
      for (const record of rawLevels) {
        const run = createRun(parseLevel(record));
        settle(run);
        let best = 0;
        for (let move = 0; move < 40; move++) {
          const candidate = run.cells.find(
            (cell) => !cell.enabled && resolveTap(run, cell).ok
          );
          if (!candidate) break;
          tap(run, candidate);
          best = Math.max(best, poweredFraction(run));
        }
        assert(best > 0, `${record.name} never powered anything`);
      }
    });

  } catch (error) {
    failed++;
    add("fail", "shipped level set could not be loaded");
    add("detail", error.message);
  } finally {
    summary.textContent = `${passed} passed, ${failed} failed`;
    summary.style.color = failed > 0 ? "#f87171" : "#5eead4";
  }
})();
